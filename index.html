<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="quiz-input glass">
            <h2>Quiz Generator</h2>
            <textarea id="quizJson" placeholder="Paste your quiz JSON here..."></textarea>
            <div class="quiz-options">
                <label class="checkbox-container">
                    <input type="checkbox" id="instantAnswer">
                    <span class="checkmark"></span>
                    Show answers instantly
                </label>
            </div>
            <div class="button-group">
                <button id="generateBtn" class="btn">Generate Quiz</button>
                <button id="promptGeneratorBtn" class="btn secondary">Prompt Generator</button>
            </div>
        </div>

        <div id="overlay" class="overlay hidden"></div>

        <div id="promptDialog" class="prompt-dialog glass hidden">
            <div class="dialog-header">
                <h2>Generate Quiz Prompt</h2>
                <button id="closePromptDialog" class="btn-icon"><i class="fas fa-times"></i></button>
            </div>
            <div class="dialog-content">
                <div class="input-group">
                    <label for="topic">Topic:</label>
                    <input type="text" id="topic" placeholder="Enter the topic for the quiz">
                </div>
                <div class="input-group">
                    <label for="questionCount">Number of Questions:</label>
                    <input type="number" id="questionCount" min="1" max="50" value="10">
                </div>
                <div class="input-group">
                    <label for="generatedPrompt">Generated Prompt:</label>
                    <textarea id="generatedPrompt" readonly></textarea>
                </div>
                <button id="copyPromptBtn" class="btn">Copy Prompt</button>
            </div>
        </div>

        <div id="quizDialog" class="quiz-dialog glass hidden">
            <div class="quiz-header">
                <span id="questionCounter">Question 1 of 10</span>
                <button id="closeDialog" class="btn-icon"><i class="fas fa-times"></i></button>
            </div>

            <div class="quiz-content">
                <h3 id="questionText">Question text goes here</h3>
                <div id="optionsContainer" class="options-container">
                    <!-- Options will be dynamically added here -->
                </div>
            </div>

            <div class="quiz-controls">
                <button id="prevBtn" class="btn-icon"><i class="fas fa-chevron-left"></i></button>
                <!-- <button id="showAnswerBtn" class="btn">Show Answer</button> -->
                <button id="nextBtn" class="btn-icon"><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>

        <div id="resultDialog" class="result-dialog glass hidden">
            <h2>Quiz Results</h2>
            <div class="result-content">
                <p>Your score: <span id="score">0</span> out of <span id="totalQuestions">0</span></p>
                <p>Percentage: <span id="percentage">0</span>%</p>
            </div>
            <div class="result-controls">
                <button id="retryBtn" class="btn">Retry</button>
                <button id="doneBtn" class="btn">Done</button>
            </div>
        </div>
    </div>
    <script src="quiz.js"></script>
</body>
</html>
